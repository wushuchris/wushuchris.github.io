<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Cinematic sunset coastline</title>
  <desc id="desc">A richly layered Pacific-style sunset coastline with glowing horizon, distant city lights, surf, cliffs, and palm silhouettes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1532"/>
      <stop offset=".22" stop-color="#23224b"/>
      <stop offset=".46" stop-color="#77465f"/>
      <stop offset=".66" stop-color="#e77a67"/>
      <stop offset=".82" stop-color="#ffb66d"/>
      <stop offset="1" stop-color="#ffd99a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a607c"/>
      <stop offset=".38" stop-color="#0a506e"/>
      <stop offset=".72" stop-color="#08344e"/>
      <stop offset="1" stop-color="#051727"/>
    </linearGradient>
    <linearGradient id="horizonWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9b69" stop-opacity=".04"/>
      <stop offset=".35" stop-color="#ffd48e" stop-opacity=".28"/>
      <stop offset=".68" stop-color="#fff0b7" stop-opacity=".52"/>
      <stop offset="1" stop-color="#ff9e63" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4be" stop-opacity=".72"/>
      <stop offset=".24" stop-color="#ffd178" stop-opacity=".40"/>
      <stop offset=".62" stop-color="#ff9b62" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff7d4b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cloudBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31304f" stop-opacity=".08"/>
      <stop offset=".28" stop-color="#4a3454" stop-opacity=".52"/>
      <stop offset=".65" stop-color="#5b354a" stop-opacity=".68"/>
      <stop offset="1" stop-color="#2d2748" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="1"/>
      <stop offset=".18" stop-color="#fff2b8" stop-opacity=".96"/>
      <stop offset=".45" stop-color="#ffd474" stop-opacity=".52"/>
      <stop offset="1" stop-color="#ff8c53" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020713" stop-opacity=".42"/>
      <stop offset=".18" stop-color="#020713" stop-opacity=".05"/>
      <stop offset=".78" stop-color="#020713" stop-opacity="0"/>
      <stop offset="1" stop-color="#020713" stop-opacity=".26"/>
    </linearGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 .055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="soft-light"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1200" height="420" fill="url(#sky)"/>

    <g opacity=".86">
      <path d="M-40 70 C120 36 255 83 410 54 S730 30 890 62 S1080 78 1245 42" fill="none" stroke="url(#cloudBand)" stroke-width="40" stroke-linecap="round"/>
      <path d="M24 115 C182 88 320 132 468 100 S770 82 925 111 S1100 126 1215 94" fill="none" stroke="#693f5d" stroke-opacity=".34" stroke-width="18" stroke-linecap="round"/>
      <path d="M235 151 C410 125 565 152 708 132 S945 118 1130 146" fill="none" stroke="#f4aa82" stroke-opacity=".18" stroke-width="8" stroke-linecap="round"/>
      <path d="M435 178 C565 163 685 179 805 165 S1040 158 1200 176" fill="none" stroke="#ffd29c" stroke-opacity=".12" stroke-width="4" stroke-linecap="round"/>
    </g>

    <circle cx="930" cy="188" r="126" fill="url(#sunGlow)" opacity=".96" filter="url(#blur24)"/>
    <circle cx="930" cy="188" r="42" fill="#fff2bd"/>
    <circle cx="930" cy="188" r="46" fill="none" stroke="#ffeab2" stroke-opacity=".44"/>

    <path d="M0 219 C142 207 262 224 382 204 S602 189 720 206 S952 220 1200 184 L1200 420 L0 420Z" fill="url(#sea)"/>
    <rect x="0" y="205" width="1200" height="128" fill="url(#horizonWarm)" opacity=".78"/>

    <path d="M884 214 C904 242 912 274 920 310 C925 334 928 359 930 397" fill="none" stroke="url(#reflection)" stroke-width="95" stroke-linecap="round" opacity=".54" filter="url(#blur8)"/>
    <path d="M906 218 C918 250 921 280 925 316 C928 348 929 374 930 405" fill="none" stroke="#fff0b4" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>

    <path d="M0 263 C118 245 218 268 334 244 S560 228 690 255 S932 276 1200 238" fill="none" stroke="#5ebfd2" stroke-width="10" opacity=".16" filter="url(#blur8)"/>
    <path d="M0 284 C126 262 238 287 350 261 S571 247 704 274 S927 294 1200 252" fill="none" stroke="#bcebf0" stroke-width="5" opacity=".42"/>
    <path d="M0 318 C152 299 253 318 379 295 S605 284 744 310 S970 326 1200 292" fill="none" stroke="#efffff" stroke-width="2.7" opacity=".40"/>
    <path d="M0 349 C151 334 268 345 392 327 S626 316 760 339 S986 353 1200 324" fill="none" stroke="#d6fbff" stroke-width="1.5" opacity=".22"/>
    <path d="M115 373 C260 354 374 365 514 347 S747 337 871 352" fill="none" stroke="#ffffff" stroke-width="1.1" opacity=".11"/>

    <g opacity=".95">
      <path d="M0 362 L70 334 128 339 188 300 246 312 318 278 388 306 447 420 0 420Z" fill="#06101a"/>
      <path d="M0 378 L82 352 145 357 197 324 262 337 340 301 411 325 467 420 0 420Z" fill="#081522" opacity=".54"/>
      <path d="M1200 330 L1146 315 1090 331 1038 303 972 318 918 420 1200 420Z" fill="#050d16"/>
      <path d="M1200 354 L1140 340 1088 348 1026 326 967 341 930 420 1200 420Z" fill="#081522" opacity=".52"/>
    </g>

    <path d="M677 239 C774 229 868 235 958 248 S1103 256 1200 238" fill="none" stroke="#22283c" stroke-width="10" opacity=".70"/>
    <path d="M693 247 C785 238 873 244 960 257 S1107 264 1192 246" fill="none" stroke="#151f30" stroke-width="5" opacity=".94"/>

    <g fill="#ffd98a" filter="url(#glow)">
      <circle cx="711" cy="247" r="2.6"/><circle cx="733" cy="244" r="2.2"/><circle cx="759" cy="245" r="2.4"/>
      <circle cx="786" cy="243" r="2.7"/><circle cx="817" cy="244" r="2.2"/><circle cx="844" cy="248" r="2.6"/>
      <circle cx="874" cy="251" r="2.2"/><circle cx="903" cy="253" r="2.6"/><circle cx="935" cy="256" r="2.1"/>
      <circle cx="967" cy="258" r="2.5"/><circle cx="1003" cy="258" r="2.2"/><circle cx="1035" cy="256" r="2.5"/>
      <circle cx="1067" cy="253" r="2.1"/><circle cx="1095" cy="250" r="2.3"/>
    </g>

    <g fill="#03080f">
      <rect x="100" y="89" width="13" height="238" rx="5" transform="rotate(-7 107 208)"/>
      <path d="M103 103 c-38 -32 -72 -25 -102 -10 31 2 53 13 69 30 -36 -10 -65 -4 -88 14 37 -1 64 8 83 27 -22 3 -39 12 -51 27 37 -8 68 -2 95 17 2 -34 2 -69 -6 -105Z"/>
      <path d="M110 104 c34 -35 71 -39 111 -21 -31 1 -54 11 -70 28 36 -6 65 2 87 21 -36 -2 -62 5 -79 22 22 3 40 13 52 28 -37 -9 -68 -2 -98 20 -1 -34 -2 -66 -3 -98Z"/>

      <rect x="205" y="130" width="11" height="203" rx="5" transform="rotate(3 210 230)"/>
      <path d="M210 142 c-30 -25 -56 -23 -80 -10 24 2 41 10 53 23 -28 -7 -50 -1 -68 13 28 0 48 6 63 20 -17 3 -31 10 -40 20 28 -6 50 -1 69 12 2 -27 4 -52 3 -78Z"/>
      <path d="M212 143 c27 -28 56 -31 89 -18 -25 2 -42 10 -55 22 28 -4 50 2 67 16 -28 -1 -47 4 -60 16 18 3 31 10 42 20 -28 -5 -51 0 -72 14 -2 -24 -6 -47 -11 -70Z"/>
    </g>

    <g opacity=".18" stroke="#fff6cf" stroke-linecap="round">
      <path d="M891 223h75" stroke-width="1.4"/>
      <path d="M900 231h58" stroke-width="1"/>
      <path d="M908 239h42" stroke-width=".8"/>
    </g>

    <g opacity=".42">
      <path d="M560 239 C628 226 696 230 758 239 S880 253 948 247 S1092 226 1200 215" fill="none" stroke="#0a2235" stroke-width="8"/>
      <path d="M612 245 C684 236 742 240 806 248 S926 258 1002 251 S1120 237 1200 232" fill="none" stroke="#173248" stroke-width="3"/>
    </g>

    <g fill="#ffd997" opacity=".30" filter="url(#glow)">
      <ellipse cx="756" cy="268" rx="2.3" ry="8"/>
      <ellipse cx="815" cy="270" rx="2.1" ry="7"/>
      <ellipse cx="875" cy="274" rx="2.4" ry="9"/>
      <ellipse cx="941" cy="276" rx="2.3" ry="10"/>
      <ellipse cx="1003" cy="276" rx="2.1" ry="8"/>
      <ellipse cx="1062" cy="272" rx="2.2" ry="7"/>
    </g>

    <path d="M906 214 C921 243 925 282 928 319" fill="none" stroke="#fff3c7" stroke-width="3" opacity=".18"/>
    <path d="M919 222 C927 252 930 286 932 324" fill="none" stroke="#ffd88a" stroke-width="1.4" opacity=".22"/>

    <rect width="1200" height="420" fill="url(#vignette)"/>
    <rect width="1200" height="420" fill="#ff9d66" opacity=".035"/>
  </g>
</svg>