<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Sunset coastline</title>
  <desc id="desc">A cinematic sunset coastline with ocean surf, layered clouds, distant lights, cliffs, and palm silhouettes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101b3d"/>
      <stop offset=".30" stop-color="#4e3154"/>
      <stop offset=".58" stop-color="#cb6668"/>
      <stop offset=".80" stop-color="#f0a35f"/>
      <stop offset="1" stop-color="#ffd08a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#113955"/>
      <stop offset=".42" stop-color="#0b6886"/>
      <stop offset=".72" stop-color="#0a5877"/>
      <stop offset="1" stop-color="#06182c"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffdca4" stop-opacity="0"/>
      <stop offset=".48" stop-color="#fff2bd" stop-opacity=".28"/>
      <stop offset=".75" stop-color="#ffb96c" stop-opacity=".20"/>
      <stop offset="1" stop-color="#fff7cf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4773" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#6d385c" stop-opacity=".62"/>
      <stop offset="1" stop-color="#2b274d" stop-opacity=".10"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff9cf" stop-opacity="1"/>
      <stop offset=".28" stop-color="#ffd982" stop-opacity=".78"/>
      <stop offset="1" stop-color="#ff8e48" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="lightGlow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

