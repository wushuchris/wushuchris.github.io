<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">System Horizon</title>
  <desc id="desc">A cinematic path from software agents toward multimodal systems, physical intelligence, AI robotics, and an open future.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04101f"/>
      <stop offset=".45" stop-color="#101c3d"/>
      <stop offset=".72" stop-color="#24204d"/>
      <stop offset="1" stop-color="#5c233f"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fff8d0" stop-opacity="1"/>
      <stop offset=".16" stop-color="#ffd277" stop-opacity=".95"/>
      <stop offset=".44" stop-color="#ff9a47" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ff6d32" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13a8ff"/>
      <stop offset=".48" stop-color="#55d9ff"/>
      <stop offset=".80" stop-color="#8ae7ff"/>
      <stop offset="1" stop-color="#ffb55b"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="smallGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cityGlow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <g opacity=".28">
    <path d="M0 70 C145 48 270 82 420 58 S720 39 870 72 S1060 87 1200 57" fill="none" stroke="#4d5b8d" stroke-width="16" stroke-linecap="round"/>
    <path d="M120 112 C300 94 430 118 590 101 S910 98 1120 119" fill="none" stroke="#7b4b73" stroke-width="10" stroke-linecap="round"/>
  </g>

  <circle cx="1028" cy="110" r="128" fill="url(#sun)" opacity=".92"/>

  <path d="M0 244 L92 186 165 225 248 155 330 225 430 172 520 238 632 165 742 232 858 153 955 210 1040 132 1125 199 1200 164 1200 320 0 320Z" fill="#081320" opacity=".97"/>
  <path d="M0 281 L125 242 214 267 320 222 438 264 555 229 688 277 806 225 945 258 1070 221 1200 248 1200 320 0 320Z" fill="#020811"/>

  <g opacity=".95">
    <rect x="930" y="161" width="18" height="61" fill="#0b1b2a"/>
    <rect x="952" y="146" width="14" height="76" fill="#0a1929"/>
    <rect x="971" y="169" width="22" height="53" fill="#0a1928"/>
    <rect x="998" y="130" width="17" height="92" fill="#091826"/>
    <rect x="1020" y="153" width="13" height="69" fill="#0b1a2a"/>
    <rect x="1038" y="140" width="19" height="82" fill="#091725"/>
    <rect x="1062" y="172" width="15" height="50" fill="#0b1b2b"/>
    <rect x="1082" y="151" width="22" height="71" fill="#081522"/>
  </g>

  <g fill="#ffcc75" opacity=".65" filter="url(#cityGlow)">
    <rect x="934" y="176" width="3" height="3"/><rect x="941" y="188" width="3" height="3"/>
    <rect x="955" y="164" width="3" height="3"/><rect x="960" y="184" width="3" height="3"/>
    <rect x="979" y="181" width="3" height="3"/><rect x="1002" y="151" width="3" height="3"/>
    <rect x="1008" y="176" width="3" height="3"/><rect x="1043" y="160" width="3" height="3"/>
    <rect x="1050" y="182" width="3" height="3"/><rect x="1087" y="171" width="3" height="3"/>
  </g>

  <path d="M78 270 C212 248 332 283 474 246 S732 226 870 196 S1016 166 1138 146" fill="none" stroke="#0a6dff" stroke-width="13" opacity=".15" filter="url(#glow)"/>
  <path d="M78 270 C212 248 332 283 474 246 S732 226 870 196 S1016 166 1138 146" fill="none" stroke="url(#roadGlow)" stroke-width="3.2" filter="url(#smallGlow)"/>

  <g fill="#8cecff" stroke="#e0fbff" stroke-width="1.4" filter="url(#smallGlow)">
    <circle cx="110" cy="264" r="6"/>
    <circle cx="294" cy="251" r="7"/>
    <circle cx="487" cy="242" r="7"/>
    <circle cx="705" cy="228" r="8"/>
    <circle cx="900" cy="188" r="9"/>
    <circle cx="1075" cy="154" r="10"/>
  </g>

  <g stroke="#7be4ff" stroke-width="2" fill="none" opacity=".92" filter="url(#smallGlow)">
    <path d="M889 178 h22 l8 8 -8 8 h-22 l-8 -8Z"/>
    <path d="M905 170 v-12 m-8 0h16"/>
    <circle cx="905" cy="186" r="2.5" fill="#b7f4ff"/>

    <path d="M1061 138 h30 v18 h-30Z"/>
    <circle cx="1068" cy="162" r="5"/><circle cx="1085" cy="162" r="5"/>
    <path d="M1066 138 v-8 h20 v8"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#bdeeff" font-size="19" font-weight="700" letter-spacing="1.4">
    <text x="62" y="302">AGENTS</text>
    <text x="420" y="292">MULTIMODAL</text>
    <text x="678" y="280">PHYSICAL INTELLIGENCE</text>
    <text x="890" y="232">AI ROBOTICS</text>
    <text x="1110" y="194">?</text>
  </g>
</svg>