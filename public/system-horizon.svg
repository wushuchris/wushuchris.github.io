<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">System Horizon</title>
  <desc id="desc">A glowing path leading from software agents toward multimodal systems, physical intelligence, AI robotics, and an open future.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061526"/>
      <stop offset=".55" stop-color="#101a38"/>
      <stop offset="1" stop-color="#3b1835"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fff7c7" stop-opacity="1"/>
      <stop offset=".2" stop-color="#ffbf5a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff8b3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="smallGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" fill="url(#sky)"/>
  <circle cx="1030" cy="115" r="120" fill="url(#sun)" opacity=".85"/>
  <path d="M0 250 L110 175 200 230 300 145 415 235 520 165 635 242 760 150 875 225 980 125 1100 205 1200 158 1200 320 0 320Z" fill="#07111f" opacity=".95"/>
  <path d="M0 286 L145 238 245 266 360 218 480 260 590 225 720 275 830 220 970 255 1080 220 1200 248 1200 320 0 320Z" fill="#020811"/>
  <path d="M85 270 C260 235 350 290 515 240 S790 225 915 190 S1040 172 1128 150" fill="none" stroke="#149dff" stroke-width="5" opacity=".35" filter="url(#glow)"/>
  <path d="M85 270 C260 235 350 290 515 240 S790 225 915 190 S1040 172 1128 150" fill="none" stroke="#67d9ff" stroke-width="2.4"/>
  <g fill="#86e7ff" stroke="#d9f8ff" stroke-width="1.3" filter="url(#smallGlow)">
    <circle cx="115" cy="265" r="6"/><circle cx="300" cy="251" r="7"/><circle cx="500" cy="244" r="7"/><circle cx="710" cy="235" r="8"/><circle cx="900" cy="194" r="9"/><circle cx="1072" cy="162" r="10"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#bdeeff" font-size="20" font-weight="700" letter-spacing="1.5">
    <text x="70" y="302">AGENTS</text>
    <text x="430" y="292">MULTIMODAL</text>
    <text x="690" y="282">PHYSICAL INTELLIGENCE</text>
    <text x="902" y="235">AI ROBOTICS</text>
    <text x="1110" y="195">?</text>
  </g>
</svg>